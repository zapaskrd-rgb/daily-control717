<!DOCTYPE html>

<head>

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
.filter-panel { background: #fff; padding: 10px 15px; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
.filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.filter-group label { font-weight: bold; margin-right: 5px; font-size: 14px; }
.filter-group label input { margin-right: 3px; }
.filter-today { background: #007bff; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
.filter-today.active { background: #28a745; }
.reset-filter-btn { background: #ffc107; color: #000; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
.reset-filter-btn:hover { background: #e0a800; }
.admin-panel { display: none; background: #f8f9fa; padding: 8px 15px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ccc; align-items: center; gap: 10px; flex-wrap: wrap; }
.admin-panel.visible { display: flex; }
.admin-panel button { padding: 4px 12px; border-radius: 4px; cursor: pointer; border: none; color: #fff; font-weight: bold; font-size: 13px; }
.admin-panel .btn-success { background: #28a745; }
.admin-panel .btn-primary { background: #007bff; }
.admin-panel .btn-warning { background: #ffc107; color: #000; }
.admin-panel .btn-info { background: #17a2b8; }
.admin-panel .reset-btn { background: #6c757d; }
.modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
.modal.visible { display: flex; }
.modal-content { background: #fff; padding: 20px; border-radius: 8px; min-width: 350px; max-width: 700px; text-align: center; max-height: 85vh; overflow-y: auto; }
.modal-content input, .modal-content textarea { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
.modal-content textarea { min-height: 60px; font-family: inherit; }
.modal-content button { padding: 6px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
.modal-content .btn-ok { background: #007bff; color: #fff; }
.modal-content .btn-cancel { background: #6c757d; color: #fff; }
.modal-content .btn-danger { background: #dc3545; color: #fff; }
.modal-content .change-item { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
.tab-btn { padding: 6px 12px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.tab-btn.active { background: #007bff; color: #fff; }
.tab-content { display: none; background: #fff; padding: 8px; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow-x: auto; }
.tab-content.active { display: block; }
table { border-collapse: collapse; font-size: 11px; white-space: nowrap; width: 100%; }
th, td { border: 1px solid #ccc; padding: 2px 4px; text-align: center; vertical-align: middle; }
th { background: #f0f0f0; position: sticky; top: 0; z-index: 10; }
.month-header { background: #d9edf7; font-weight: bold; border-bottom: 3px solid #333 !important; }
.month-end { border-right: 3px solid #333 !important; }
.week-start { border-left: 2px solid #666 !important; }
.day-end { border-bottom: 3px solid #333 !important; }
.day-header, .task-name { text-align: left; padding-left: 8px; min-width: 200px; max-width: 400px; white-space: normal; word-break: break-word; }
.day-header { font-weight: bold; }
.day-1 { background-color: #e3f2fd; }
.day-2 { background-color: #e8f5e9; }
.day-3 { background-color: #fff3e0; }
.day-4 { background-color: #fce4ec; }
.day-5 { background-color: #f3e5f5; }
.checkbox-cell { text-align: center; transition: background-color 0.2s; }
.checkbox-cell.done-on-time { background-color: #a3d9a5 !important; }
.checkbox-cell.done-late { background-color: #ffec8b !important; }
.checkbox-cell.missed { background-color: #f9f9f9 !important; }
input[type="checkbox"] { cursor: pointer; width: 14px; height: 14px; accent-color: darkgreen; margin: 0; }
input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.7; }
.cross-mark { color: red; font-size: 16px; font-weight: bold; }
.empty-cell { background: #f9f9f9; }
.task-desc { cursor: pointer; color: #007bff; text-decoration: underline; }
.task-desc:hover { color: #0056b3; }
.blocked-cell { background-color: #d3d3d3 !important; }
.done-cell { background-color: #28a745 !important; color: #fff; cursor: pointer; }
.done-cell:hover { opacity: 0.8; }
.overdue-cell { background-color: #dc3545 !important; color: #fff; }
.task-title-cell { min-width: 200px; max-width: 350px; white-space: normal; word-break: break-word; text-align: left; padding: 4px 6px; }
.task-note-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #007bff; margin-left: 5px; padding: 0; }
.task-note-btn:hover { color: #0056b3; }
.task-info-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #17a2b8; margin-left: 3px; padding: 0; }
.task-info-btn:hover { color: #0f7a8a; }
.task-del-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #dc3545; margin-left: 3px; padding: 0; }
.task-del-btn:hover { color: #a01828; }
.footer { margin-top: 20px; font-size: 12px; color: #666; display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
.footer .admin-btn { background: #6c757d; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
.footer .admin-btn.active { background: #28a745; }
.no-data { padding: 20px; text-align: center; font-size: 16px; color: #888; }
.stats-table td, .stats-table th { padding: 4px 8px; font-size: 12px; }
.stats-filter { display: flex; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.stats-filter select, .stats-filter input { padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; }

/* Sticky first column for tab2 */
#tab2 table th.sticky-col,
#tab2 table td.sticky-col {
    position: sticky;
    left: 0;
    z-index: 5;
    background: #f0f0f0;
}
#tab2 table th.sticky-col { z-index: 25; }
#tab2 table td.sticky-col { background: #fafafa; font-weight: bold; text-align: left; padding-left: 8px; }

/* Common tasks editor */
.common-tasks-table th, .common-tasks-table td { padding: 6px 8px; font-size: 13px; text-align: left; }
.common-tasks-table textarea { width: 100%; min-height: 40px; font-size: 13px; padding: 4px 6px; }
.common-tasks-table input[type="text"] { width: 100%; padding: 4px 6px; font-size: 13px; }
</style>

<body>

<div id="tab1" class="tab-content"></div>

<script>
// ====================================================================
// 1. ПОДКЛЮЧЕНИЕ SUPABASE
// ====================================================================
const SUPABASE_URL = 'https://pqfswgavkhotvtdcfbcm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eB_viieych0bhJapY0tL_g_9y5zJ9DQ';

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserId = null;
let appData = null;
let subscription = null;

const DEFAULT_DEPARTMENTS = [
{ id: '1_КРД', label: '1 отдел Вика' },
{ id: '1_НВР_ВЛД', label: '1 отдел Артем' },
{ id: '2', label: '2 отдел' },
{ id: '3', label: '3 отдел' },
{ id: '4', label: '4 отдел' },
{ id: '5', label: '5 отдел' },
{ id: '6', label: '6 отдел' },
{ id: '7', label: '7 отдел' },
{ id: '8', label: '8 отдел' },
{ id: '9_Денис', label: '9 отдел Денис' },
{ id: '9_Катя', label: '9 отдел Катя' },
{ id: '9_Дима', label: '9 отдел Дима' },
{ id: '10', label: '10 отдел' },
{ id: '11', label: '11 отдел' },
{ id: '12_Вика', label: '12 отдел Вика' },
{ id: '12_Аня', label: '12 отдел Аня' },
{ id: '13', label: '13 отдел' },
{ id: '14', label: '14 отдел' },
{ id: '15', label: '15 отдел' }
];

const DEFAULT_CONTROL_TASKS = {
tasks: [
{ id: 't1', title: 'Согласовать бюджет', description: 'Согласовать бюджет с финансовым отделом до 15 числа', deadline: '2026-09-15', type: 'Контроль задач' },
{ id: 't2', title: 'Подготовить отчёт', description: 'Подготовить ежемесячный отчёт по продажам', deadline: '2026-09-20', type: 'Контроль задач' },
{ id: 't3', title: 'Провести встречу', description: 'Провести встречу с командой по проекту', deadline: '2026-09-25', type: 'Контроль задач' }
],
taskStatus: {},
logs: []
};

function initDefaultControlTasks() {
const tasks = DEFAULT_CONTROL_TASKS.tasks;
tasks.forEach(t => {
DEFAULT_DEPARTMENTS.forEach(dept => {
const key = t.id + '_' + dept.id;
DEFAULT_CONTROL_TASKS.taskStatus[key] = { done: false, comment: '', blocked: false, doneDate: null, pendingComment: false };
});
});
}
initDefaultControlTasks();

// ====================================================================
// 2. ЗАГРУЗКА / СОХРАНЕНИЕ ДАННЫХ
// ====================================================================
async function loadAppData() {
try {
const { data, error } = await supabaseClient.from('app_data').select('data').eq('id', 'main').single();
if (error) {
if (error.code === 'PGRST116') {
const initialData = createInitialData();
await supabaseClient.from('app_data').insert([{ id: 'main', data: initialData }]);
appData = initialData;
} else { console.error('Ошибка загрузки:', error); return; }
} else {
appData = migrateAppData(data.data);
}
setupRealtimeSubscription();
onDataLoaded();
} catch (e) { console.error('Ошибка:', e); }
}

function createInitialData() {
return {
departments: JSON.parse(JSON.stringify(DEFAULT_DEPARTMENTS)),
commonTasks: [],
assignedTasks: {},
checkboxStates: {},
controlTasks: JSON.parse(JSON.stringify(DEFAULT_CONTROL_TASKS)),
monthsVisibility: [true, true, true, true, true]
};
}

function migrateAppData(data) {
if (data.commonTasks && data.departments) {
if (!data.assignedTasks) data.assignedTasks = {};
if (!data.checkboxStates) data.checkboxStates = {};
if (!data.monthsVisibility) data.monthsVisibility = [true, true, true, true, true];
if (!data.controlTasks) data.controlTasks = JSON.parse(JSON.stringify(DEFAULT_CONTROL_TASKS));
if (!data.controlTasks.logs) data.controlTasks.logs = [];
if (!data.controlTasks.taskStatus) data.controlTasks.taskStatus = {};
return data;
}
// Миграция со старого формата (dailyTasks)
const newData = {
departments: JSON.parse(JSON.stringify(DEFAULT_DEPARTMENTS)),
commonTasks: [],
assignedTasks: {},
checkboxStates: {},
controlTasks: data.controlTasks || JSON.parse(JSON.stringify(DEFAULT_CONTROL_TASKS)),
monthsVisibility: [true, true, true, true, true]
};
const taskMap = new Map();
for (const dow in (data.dailyTasks || {})) {
(data.dailyTasks[dow] || []).forEach(title => {
if (!taskMap.has(title)) {
const id = 'ct_' + (taskMap.size + 1) + '_' + Date.now();
taskMap.set(title, id);
newData.commonTasks.push({ id, title, note: '' });
}
});
}
const firstDept = newData.departments[0];
newData.assignedTasks[firstDept.id] = {};
for (const dow in (data.dailyTasks || {})) {
newData.assignedTasks[firstDept.id][dow] = (data.dailyTasks[dow] || []).map(t => taskMap.get(t));
}
return newData;
}

function setupRealtimeSubscription() {
if (subscription) { subscription.unsubscribe(); subscription = null; }
subscription = supabaseClient.channel('app_data_changes')
.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'id=eq.main' }, payload => {
appData = migrateAppData(payload.new.data);
onDataLoaded();
}).subscribe();
}

function onDataLoaded() {
if (!appData) return;
const activeTab = document.querySelector('.tab-content.active');
if (activeTab) {
const tabId = activeTab.id;
if (tabId === 'tab1') buildTab1();
else if (tabId === 'tab2') buildTab2();
else if (tabId === 'tab3') buildTab3();
else if (tabId === 'tab4') buildTab4();
} else switchTab('tab2');
}

async function saveAppData() {
if (!appData) return;
try {
const { error } = await supabaseClient.from('app_data').update({ data: appData }).eq('id', 'main');
if (error) console.error('Ошибка сохранения:', error);
} catch (e) { console.error('Ошибка сохранения:', e); }
}

function addLog(taskId, depId, action, taskType, comment) {
if (!appData) return;
const now = new Date();
const logEntry = {
taskId, depId, action,
timestamp: now.toISOString(),
date: now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
userType: isAdmin ? 'admin' : 'user',
taskType: taskType || 'Контроль задач',
comment: comment || '',
userId: currentUserId || 'anonymous'
};
if (!appData.controlTasks.logs) appData.controlTasks.logs = [];
appData.controlTasks.logs.push(logEntry);
saveAppData();
}

// ====================================================================
// 3. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ====================================================================
const YEAR = 2026;
const MONTHS = ['Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTH_INDEXES = [7, 8, 9, 10, 11];

let selectedMonths = [0,1,2,3,4];
let selectedDays = [1,2,3,4,5];
let showTodayOnly = false;
let isAdmin = false;
let hasUnsavedChanges = false;
let changeLog = [];

function addChange(desc) { if (isAdmin) { changeLog.push(desc); hasUnsavedChanges = true; } }

function loadState() {
try {
const savedMonths = localStorage.getItem('filter_months');
if (savedMonths) selectedMonths = JSON.parse(savedMonths);
const savedDays = localStorage.getItem('filter_days');
if (savedDays) selectedDays = JSON.parse(savedDays);
const savedToday = localStorage.getItem('filter_today');
if (savedToday === 'true') showTodayOnly = true;
const savedAdmin = localStorage.getItem('isAdmin');
if (savedAdmin === 'true') isAdmin = true;
} catch(e) {}

document.querySelectorAll('.month-filter').forEach(cb => {
cb.checked = selectedMonths.includes(parseInt(cb.value));
});
document.querySelectorAll('.day-filter').forEach(cb => {
cb.checked = selectedDays.includes(parseInt(cb.value));
});
const todayBtn = document.getElementById('todayBtn');
if (showTodayOnly) { todayBtn.classList.add('active'); todayBtn.textContent = 'Сегодня (вкл)'; }
else { todayBtn.classList.remove('active'); todayBtn.textContent = 'Сегодня'; }
const adminBtn = document.getElementById('adminBtn');
if (isAdmin) {
adminBtn.classList.add('active');
adminBtn.textContent = 'Админ (вкл)';
document.getElementById('adminPanel').style.display = 'flex';
document.getElementById('statsTabBtn').style.display = 'inline-block';
document.getElementById('editorTabBtn').style.display = 'inline-block';
} else {
adminBtn.classList.remove('active');
adminBtn.textContent = 'Админ';
document.getElementById('adminPanel').style.display = 'none';
document.getElementById('statsTabBtn').style.display = 'none';
document.getElementById('editorTabBtn').style.display = 'none';
}
if (!isAdmin) { hasUnsavedChanges = false; changeLog = []; }
}

function saveFilter() {
localStorage.setItem('filter_months', JSON.stringify(selectedMonths));
localStorage.setItem('filter_days', JSON.stringify(selectedDays));
localStorage.setItem('filter_today', showTodayOnly ? 'true' : 'false');
localStorage.setItem('isAdmin', isAdmin ? 'true' : 'false');
}

function getDatesForDay(monthIndex, dayOfWeek) {
const dates = [];
const date = new Date(YEAR, monthIndex, 1);
let diff = dayOfWeek - date.getDay();
if (diff < 0) diff += 7;
date.setDate(date.getDate() + diff);
while (date.getMonth() === monthIndex) {
dates.push(date.getDate());
date.setDate(date.getDate() + 7);
}
return dates;
}

function getWeeksForMonth(monthIndex) {
const weeks = [];
let firstDate = new Date(YEAR, monthIndex, 1);
let dayOfWeek = firstDate.getDay();
firstDate.setDate(firstDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
let current = new Date(firstDate);
while (current.getMonth() <= monthIndex && current.getFullYear() === YEAR) {
const week = [];
let hasDayInMonth = false;
for (let d = 0; d < 5; d++) {
const dateObj = new Date(current);
dateObj.setDate(dateObj.getDate() + d);
week.push({ dayOfWeek: d + 1, monthIndex: dateObj.getMonth(), date: dateObj.getDate() });
if (dateObj.getMonth() === monthIndex) hasDayInMonth = true;
}
if (hasDayInMonth) weeks.push(week);
current.setDate(current.getDate() + 7);
if (current.getMonth() > monthIndex) break;
}
return weeks;
}

function isDayPassedByDate(dateObj) {
const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const planned = new Date(YEAR, dateObj.monthIndex, dateObj.date);
return today > planned;
}

function formatDate(monthIndex, day) {
return new Date(YEAR, monthIndex, day).toISOString().slice(0, 10);
}

// ====================================================================
// 4. ЗАДАЧИ ДЛЯ ОТДЕЛА/ДНЯ
// ====================================================================
function getTasksForDeptDay(deptId, dow) {
const ids = (appData.assignedTasks[deptId] && appData.assignedTasks[deptId][dow]) || [];
return ids.map(id => appData.commonTasks.find(t => t.id === id)).filter(Boolean);
}

// ====================================================================
// 5. ВКЛАДКА 1 — ЕЖЕДНЕВНЫЙ САМОКОНТРОЛЬ
// ====================================================================
let currentDeptTab1 = null;

function buildTab1() {
const container = document.getElementById('tab1');
container.innerHTML = '';

if (!currentDeptTab1 || !appData.departments.find(d => d.id === currentDeptTab1)) {
currentDeptTab1 = appData.departments[0] ? appData.departments[0].id : null;
}

let html = '<div class="tabs" style="margin-bottom:10px;">';
appData.departments.forEach(t => {
const active = t.id === currentDeptTab1 ? 'active' : '';
html += `<button class="tab-btn ${active}" data-dept="${t.id}">${escapeHtml(t.label)}</button>`;
});
html += '</div>';
container.innerHTML = html;

container.querySelectorAll('.tab-btn[data-dept]').forEach(btn => {
btn.addEventListener('click', function() {
currentDeptTab1 = this.dataset.dept;
buildTab1();
});
});

const tableContainer = document.createElement('div');
tableContainer.id = 'tab1TableContainer';
container.appendChild(tableContainer);

if (currentDeptTab1) {
tableContainer.appendChild(buildTableForDept(currentDeptTab1));
}
}

function escapeHtml(s) {
if (!s) return '';
return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildTableForDept(departmentId) {
const tasksByDay = {};
for (let dow = 1; dow <= 5; dow++) tasksByDay[dow] = getTasksForDeptDay(departmentId, dow);

if (showTodayOnly) return buildTodayTable(departmentId, tasksByDay);

const displayMonths = MONTH_INDEXES.filter((_, idx) => selectedMonths.includes(idx) && appData.monthsVisibility[idx]);
if (displayMonths.length === 0) {
const div = document.createElement('div');
div.className = 'no-data';
div.textContent = 'Нет видимых месяцев';
return div;
}

const monthWeeks = displayMonths.map(mIdx => ({
monthIndex: mIdx,
monthName: MONTHS[MONTH_INDEXES.indexOf(mIdx)],
weeks: getWeeksForMonth(mIdx)

function updateCellStyle(checkbox) {
const td = checkbox.closest('td');
if (!td) return;
const cbState = appData.checkboxStates[checkbox.id];
const savedState = cbState ? cbState.state : null;
const savedDate = cbState ? cbState.date : null;
const parts = checkbox.id.split('_');
const plannedDate = parts[parts.length - 1];
td.classList.remove('done-on-time', 'done-late', 'missed');
if (savedState === true) {
if (savedDate === plannedDate) td.classList.add('done-on-time');
else td.classList.add('done-late');
}
}

function openAddTasksModal(deptId, dow) {
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
const assigned = (appData.assignedTasks[deptId] && appData.assignedTasks[deptId][dow]) || [];
const available = appData.commonTasks.filter(t => !assigned.includes(t.id));
const dayNames = ['', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница'];
const deptLabel = appData.departments.find(d => d.id === deptId)?.label || '';

let html = `<h3>Добавить задачи</h3>`;
html += `<p style="font-size:13px;color:#555;">Отдел: <b>${escapeHtml(deptLabel)}</b><br>День: <b>${dayNames[dow]}</b></p>`;

if (available.length === 0) {
html += '<p>Все задачи из общего списка уже назначены на этот день.</p>';
} else {
html += '<div style="max-height:300px;overflow-y:auto;text-align:left;border:1px solid #eee;border-radius:4px;padding:6px;">';
available.forEach(t => {
html += `<label style="display:block;padding:4px;font-size:14px;"><input type="checkbox" class="add-task-cb" value="${t.id}"> ${escapeHtml(t.title)}</label>`;
});
html += '</div>';
html += `<button class="btn-ok" onclick="saveAddedTasks('${deptId}', ${dow})">Добавить выбранные</button>`;
}
html += `<button class="btn-cancel" onclick="closeModal()">Закрыть</button>`;
content.innerHTML = html;
modal.classList.add('visible');
}

function saveAddedTasks(deptId, dow) {
const checkboxes = document.querySelectorAll('.add-task-cb:checked');
const idsToAdd = Array.from(checkboxes).map(cb => cb.value);
if (idsToAdd.length === 0) { closeModal(); return; }
if (!appData.assignedTasks[deptId]) appData.assignedTasks[deptId] = {};
if (!appData.assignedTasks[deptId][dow]) appData.assignedTasks[deptId][dow] = [];
idsToAdd.forEach(id => {
if (!appData.assignedTasks[deptId][dow].includes(id)) appData.assignedTasks[deptId][dow].push(id);
});
saveAppData();
closeModal();
buildTab1();
}

data2.taskStatus[key2].comment = '';
data2.taskStatus[key2].doneDate = null;
data2.taskStatus[key2].pendingComment = false;
}

});

}

saveAppData();
addLog(taskId, depId, 'done', 'Контроль задач', comment);
closeModal();
alert('Задача отмечена как выполненная.');

}

<label>Дата: <select id="statsDateFilter">
<option value="all">Все</option>
<option value="today">Сегодня</option>
<option value="week">Неделя</option>
</select></label>
<button onclick="applyStatsFilters()">Применить</button>
`;
container.appendChild(filterDiv);

const statsContainer = document.createElement('div');
statsContainer.id = 'statsContainer';
container.appendChild(statsContainer);

function renderStats() {
const typeFilter = document.getElementById('statsTypeFilter').value;
const deptFilter = document.getElementById('statsDeptFilter').value;
const dateFilter = document.getElementById('statsDateFilter').value;

let filtered = allLogs.filter(l => l.userType === 'user');
if (typeFilter !== 'all') filtered = filtered.filter(l => l.taskType === typeFilter);
if (deptFilter !== 'all') filtered = filtered.filter(l => String(l.depId) === String(deptFilter));

const now = new Date();
const todayStr = now.toISOString().slice(0, 10);
if (dateFilter === 'today') filtered = filtered.filter(l => l.timestamp && l.timestamp.slice(0, 10) === todayStr);
else if (dateFilter === 'week') {
const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7);
filtered = filtered.filter(l => l.timestamp >= weekAgo.toISOString());
}

const statusMap = {};
filtered.forEach(log => {
const key = log.taskId + '_' + log.depId;
if (!statusMap[key] || new Date(log.timestamp) > new Date(statusMap[key].timestamp)) statusMap[key] = log;
});

statsContainer.innerHTML = '';

const statusTable = document.createElement('table');
statusTable.className = 'stats-table';
const thead = document.createElement('thead');
thead.innerHTML = `<tr><th>Задача</th><th>Тип</th><th>Отдел</th><th>Статус</th><th>Комментарий</th><th>Дата</th></tr>`;
statusTable.appendChild(thead);
const tbody = document.createElement('tbody');

Object.keys(statusMap).forEach(key => {
const log = statusMap[key];
let taskTitle = log.taskId;
let taskType = log.taskType || 'Контроль задач';
if (!log.taskId.startsWith('daily_') && !log.taskId.startsWith('note_')) {
const t = tasks.find(x => x.id === log.taskId);
if (t) taskTitle = t.title;
}
const dept = appData.departments.find(d => String(d.id) === String(log.depId));
const deptLabel = dept ? dept.label : ('Отдел ' + log.depId);
const status = log.action === 'done' ? '✅ Выполнено' : (log.action === 'block' ? '⛔ Заблокировано' : '⏳ Не выполнено');
const tr = document.createElement('tr');
tr.innerHTML = `<td>${escapeHtml(taskTitle)}</td><td>${taskType}</td><td>${escapeHtml(deptLabel)}</td><td>${status}</td><td style="white-space:pre-wrap;max-width:150px;">${escapeHtml(log.comment || '')}</td><td>${log.date || log.timestamp}</td>`;
tbody.appendChild(tr);
});
statusTable.appendChild(tbody);
statsContainer.appendChild(statusTable);

const logsDiv = document.createElement('div');
logsDiv.innerHTML = '<h3>Логи действий</h3>';
const logTable = document.createElement('table');
logTable.className = 'stats-table';
const logThead = document.createElement('thead');
logThead.innerHTML = `<tr><th>Задача</th><th>Тип</th><th>Время</th><th>Действие</th><th>Комментарий</th></tr>`;
logTable.appendChild(logThead);
const logTbody = document.createElement('tbody');
const sorted = [...filtered].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
sorted.forEach(log => {
let taskTitle = log.taskId;
let taskType = log.taskType || 'Контроль задач';
if (!log.taskId.startsWith('daily_') && !log.taskId.startsWith('note_')) {
const t = tasks.find(x => x.id === log.taskId);
if (t) taskTitle = t.title;
}
const actionLabel = {done:'Выполнено', uncheck:'Снято', block:'Блокировка', edit_note:'Ред. заметки', delete_note:'Уд. заметки', edit_comment:'Ред. комментария'}[log.action] || log.action;
const tr = document.createElement('tr');
tr.innerHTML = `<td>${escapeHtml(taskTitle)}</td><td>${taskType}</td><td>${log.date || log.timestamp}</td><td>${actionLabel}</td><td style="white-space:pre-wrap;max-width:150px;">${escapeHtml(log.comment || '')}</td>`;
logTbody.appendChild(tr);
});
logTable.appendChild(logTbody);
logsDiv.appendChild(logTable);
statsContainer.appendChild(logsDiv);
}

window.applyStatsFilters = renderStats;
renderStats();
}

// ====================================================================

container.innerHTML = '';
if (!isAdmin) { container.innerHTML = '<div class="no-data">Только для администратора.</div>'; return; }

const wrap = document.createElement('div');
wrap.style.padding = '10px';

wrap.appendChild(h);

const hint = document.createElement('p');

wrap.appendChild(hint);

const table = document.createElement('table');
table.className = 'common-tasks-table';
const thead = document.createElement('thead');
thead.innerHTML = '<tr><th style="width:35%">Название задачи</th><th>Заметка</th><th style="width:60px">Действия</th></tr>';
table.appendChild(thead);
const tbody = document.createElement('tbody');

appData.commonTasks.forEach(task => {
const tr = document.createElement('tr');

const titleTd = document.createElement('td');

titleInput.type = 'text';
titleInput.value = task.title;
titleInput.addEventListener('change', function() {
const v = this.value.trim();
if (!v) { this.value = task.title; return; }
task.title = v;
saveAppData();
buildTab1();
});
titleTd.appendChild(titleInput);
tr.appendChild(titleTd);

const noteTd = document.createElement('td');
const noteInput = document.createElement('textarea');
noteInput.value = task.note || '';
noteInput.addEventListener('change', function() {
task.note = this.value;
saveAppData();
});
noteTd.appendChild(noteInput);
tr.appendChild(noteTd);

const delTd = document.createElement('td');
const delBtn = document.createElement('button');
delBtn.textContent = '❌';
delBtn.style.background = '#dc3545';
delBtn.style.color = '#fff';
delBtn.style.border = 'none';
delBtn.style.padding = '4px 8px';
delBtn.style.borderRadius = '4px';
delBtn.style.cursor = 'pointer';
delBtn.addEventListener('click', () => {
if (!confirm(`Удалить задачу "${task.title}" из общего списка?\nОна также будет удалена из всех назначений.`)) return;
appData.commonTasks = appData.commonTasks.filter(t => t.id !== task.id);
for (const deptId in appData.assignedTasks) {
for (const dow in appData.assignedTasks[deptId]) {
appData.assignedTasks[deptId][dow] = appData.assignedTasks[deptId][dow].filter(id => id !== task.id);
}
}
saveAppData();
buildTab4();
buildTab1();
});
delTd.appendChild(delBtn);
tr.appendChild(delTd);

tbody.appendChild(tr);
});
table.appendChild(tbody);
wrap.appendChild(table);

const addBtn = document.createElement('button');
addBtn.textContent = '➕ Добавить задачу';
addBtn.style.marginTop = '12px';
addBtn.style.padding = '8px 16px';
addBtn.style.background = '#28a745';
addBtn.style.color = '#fff';
addBtn.style.border = 'none';
addBtn.style.borderRadius = '4px';
addBtn.style.cursor = 'pointer';
addBtn.style.fontSize = '14px';
addBtn.addEventListener('click', () => {
const newId = 'ct_' + Date.now();
appData.commonTasks.push({ id: newId, title: 'Новая задача', note: '' });
saveAppData();
buildTab4();
});
wrap.appendChild(addBtn);

container.appendChild(wrap);
}

function showTaskDescription(task) {
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
content.innerHTML = `
<h3>${escapeHtml(task.title)}</h3>
<p><strong>Описание:</strong> ${escapeHtml(task.description || 'Нет описания')}</p>

<button class="btn-cancel" onclick="closeModal()">Закрыть</button>

}

function editTask(taskId) {
const task = appData.controlTasks.tasks.find(t => t.id === taskId);
if (!task) return;
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
content.innerHTML = `
<h3>Редактирование задачи</h3>
<input type="text" id="editTitle" value="${escapeHtml(task.title)}" placeholder="Название">
<textarea id="editDesc" placeholder="Описание">${escapeHtml(task.description || '')}</textarea>
<input type="date" id="editDeadline" value="${task.deadline || ''}">
<button class="btn-ok" onclick="saveEditTask('${taskId}')">Сохранить</button>
<button class="btn-cancel" onclick="closeModal()">Отмена</button>
`;
modal.classList.add('visible');
}

function saveEditTask(taskId) {
const title = document.getElementById('editTitle').value.trim();
const description = document.getElementById('editDesc').value.trim();
const deadline = document.getElementById('editDeadline').value;
if (!title) { alert('Название обязательно'); return; }
const task = appData.controlTasks.tasks.find(t => t.id === taskId);
if (task) {
task.title = title; task.description = description; task.deadline = deadline;
saveAppData();
addChange(`Задача обновлена: "${title}"`);
}
closeModal();
buildTab2();
}

function deleteTask(taskId) {
if (!confirm('Удалить задачу?')) return;
const task = appData.controlTasks.tasks.find(t => t.id === taskId);
if (task) addChange(`Удалена задача "${task.title}"`);
appData.controlTasks.tasks = appData.controlTasks.tasks.filter(t => t.id !== taskId);
Object.keys(appData.controlTasks.taskStatus).forEach(key => {
if (key.startsWith(taskId + '_')) delete appData.controlTasks.taskStatus[key];
});
saveAppData();
alert('Задача удалена.');
buildTab2();
}

function addTask() {
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
content.innerHTML = `
<h3>Добавить задачу (Контроль)</h3>
<input type="text" id="newTitle" placeholder="Название задачи">
<textarea id="newDesc" placeholder="Описание"></textarea>
<input type="date" id="newDeadline">
<button class="btn-ok" onclick="saveNewTask()">Добавить</button>
<button class="btn-cancel" onclick="closeModal()">Отмена</button>
`;
modal.classList.add('visible');
}

function saveNewTask() {
const title = document.getElementById('newTitle').value.trim();
const description = document.getElementById('newDesc').value.trim();
const deadline = document.getElementById('newDeadline').value;
if (!title) { alert('Название обязательно'); return; }
const newId = 't' + Date.now();
appData.controlTasks.tasks.push({ id: newId, title, description, deadline, type: 'Контроль задач' });
appData.departments.forEach(dept => {
const key = newId + '_' + dept.id;
appData.controlTasks.taskStatus[key] = { done: false, comment: '', blocked: false, doneDate: null, pendingComment: false };
});
saveAppData();
addChange(`Добавлена задача "${title}"`);
alert('Задача добавлена.');
closeModal();
buildTab2();
}

// 11. УПРАВЛЕНИЕ ОТДЕЛАМИ
// ====================================================================
function manageDepartments() {
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
let html = '<h3>Управление отделами</h3>';
html += '<p style="font-size:12px;color:#666;">Можно изменить название, удалить или добавить новый отдел.</p>';
html += '<div style="max-height:400px;overflow-y:auto;text-align:left;border:1px solid #eee;border-radius:4px;padding:6px;">';
appData.departments.forEach((dept, idx) => {
html += `<div style="display:flex;gap:8px;padding:6px 4px;align-items:center;border-bottom:1px solid #f0f0f0;">
<input type="text" value="${escapeHtml(dept.label)}" data-idx="${idx}" class="dept-label-input" style="flex:1;padding:4px 6px;border:1px solid #ccc;border-radius:4px;">
<button onclick="deleteDepartment(${idx})" style="background:#dc3545;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;">❌</button>
</div>`;
});
html += '</div>';
html += '<div style="margin-top:12px;display:flex;gap:8px;"><input type="text" id="newDeptLabel" placeholder="Название нового отдела" style="flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;"><button onclick="addDepartment()" style="padding:6px 16px;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;">Добавить</button></div>';
html += '<div style="margin-top:12px;"><button class="btn-ok" onclick="saveDepartmentsLabels()">Сохранить названия</button><button class="btn-cancel" onclick="closeModal()">Закрыть</button></div>';
content.innerHTML = html;
modal.classList.add('visible');
}

function saveDepartmentsLabels() {
document.querySelectorAll('.dept-label-input').forEach(input => {
const idx = parseInt(input.dataset.idx);
const v = input.value.trim();
if (v) appData.departments[idx].label = v;
});
saveAppData();
closeModal();
buildTab1();
buildTab2();
alert('Названия сохранены.');
}

function addDepartment() {
const label = document.getElementById('newDeptLabel').value.trim();
if (!label) { alert('Введите название'); return; }
const newId = 'd_' + Date.now();
appData.departments.push({ id: newId, label });
if (!appData.assignedTasks[newId]) appData.assignedTasks[newId] = {};
appData.controlTasks.tasks.forEach(task => {
const key = task.id + '_' + newId;
if (!appData.controlTasks.taskStatus[key]) {
appData.controlTasks.taskStatus[key] = { done: false, comment: '', blocked: false, doneDate: null, pendingComment: false };
}
});
saveAppData();
closeModal();
manageDepartments();
buildTab1();
buildTab2();
}

function deleteDepartment(idx) {
const dept = appData.departments[idx];
if (!confirm(`Удалить отдел "${dept.label}"?`)) return;
appData.departments.splice(idx, 1);
saveAppData();
closeModal();
manageDepartments();
buildTab1();
buildTab2();
}

// ====================================================================
// 12. УПРАВЛЕНИЕ ВИДИМОСТЬЮ МЕСЯЦЕВ

function manageMonths() {
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
let html = '<h3>Видимость месяцев</h3><p style="font-size:13px;color:#666;">Скрытые месяцы не будут отображаться у пользователей.</p>';
MONTHS.forEach((name, idx) => {
const v = appData.monthsVisibility[idx];
html += `<label style="display:block;padding:8px;font-size:16px;text-align:left;"><input type="checkbox" class="month-vis-cb" data-idx="${idx}" ${v ? 'checked' : ''}> ${name}</label>`;
});
html += '<button class="btn-ok" onclick="saveMonthsVisibility()">Сохранить</button>';
html += '<button class="btn-cancel" onclick="closeModal()">Отмена</button>';
content.innerHTML = html;
modal.classList.add('visible');
}

function saveMonthsVisibility() {
document.querySelectorAll('.month-vis-cb').forEach(cb => {
const idx = parseInt(cb.dataset.idx);
appData.monthsVisibility[idx] = cb.checked;
});
saveAppData();
closeModal();
applyMonthVisibilityToFilters();
buildTab1();
}

function applyMonthVisibilityToFilters() {
document.querySelectorAll('.month-filter').forEach(cb => {
const idx = parseInt(cb.value);
const label = cb.closest('label');
const visible = appData.monthsVisibility[idx];
label.style.display = visible ? '' : 'none';
if (!visible) cb.checked = false;
});
}

// ====================================================================
// 13. СОХРАНЕНИЕ И ВЫХОД
// ====================================================================
function saveChanges() {
if (!hasUnsavedChanges) { alert('Нет несохранённых изменений.'); return; }
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
let changesHtml = changeLog.map(item => `<div class="change-item">• ${escapeHtml(item)}</div>`).join('');
content.innerHTML = `
<h3>Подтверждение</h3>
<p>Изменения будут сохранены:</p>
<div style="max-height:250px;overflow-y:auto;text-align:left;margin:10px 0;border:1px solid #eee;border-radius:4px;">${changesHtml}</div>
<button class="btn-ok" onclick="confirmSave()">Подтвердить</button>
<button class="btn-cancel" onclick="closeModal()">Отмена</button>
`;
modal.classList.add('visible');
}

function confirmSave() {
hasUnsavedChanges = false;
changeLog = [];
closeModal();
alert('Изменения сохранены.');
}

function logoutAdmin() {
if (hasUnsavedChanges && !confirm('Есть несохранённые изменения. Выйти?')) return;
isAdmin = false;
hasUnsavedChanges = false;
changeLog = [];
saveFilter();
const adminBtn = document.getElementById('adminBtn');
adminBtn.classList.remove('active');
adminBtn.textContent = 'Админ';
document.getElementById('adminPanel').style.display = 'none';
document.getElementById('statsTabBtn').style.display = 'none';
document.getElementById('editorTabBtn').style.display = 'none';
const activeTab = document.querySelector('.tab-content.active');
if (activeTab) {
const tabId = activeTab.id;
if (tabId === 'tab1') buildTab1();
else if (tabId === 'tab2') buildTab2();
else if (tabId === 'tab3') buildTab3();
else if (tabId === 'tab4') buildTab4();
}
}

// ====================================================================
// 14. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ====================================================================
function switchTab(tabId) {
document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
document.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.classList.remove('active'));
document.getElementById(tabId).classList.add('active');
const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
if (btn) btn.classList.add('active');
document.getElementById('filterPanel').style.display = (tabId === 'tab1') ? 'flex' : 'none';

if (tabId === 'tab1') buildTab1();
else if (tabId === 'tab2') buildTab2();
else if (tabId === 'tab3') buildTab3();
else if (tabId === 'tab4') buildTab4();
}

// ====================================================================
// 15. АУТЕНТИФИКАЦИЯ И СТАРТ
// ====================================================================
async function signInAnonymously() {
try {
const { data, error } = await supabaseClient.auth.signInAnonymously();
if (error) throw error;
currentUserId = data.user.id;
console.log('Анонимный вход выполнен, uid:', currentUserId);
} catch (error) {
console.error('Ошибка анонимного входа:', error);
}
loadAppData();
}

function init() {
loadState();
applyMonthVisibilityToFilters();

document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
btn.addEventListener('click', function() { switchTab(this.dataset.tab); });
});

document.querySelectorAll('.month-filter, .day-filter').forEach(cb => {
cb.addEventListener('change', function() {
if (showTodayOnly) {
showTodayOnly = false;
document.getElementById('todayBtn').classList.remove('active');
document.getElementById('todayBtn').textContent = 'Сегодня';
}
selectedMonths = [];
document.querySelectorAll('.month-filter').forEach(x => { if (x.checked && appData.monthsVisibility[parseInt(x.value)]) selectedMonths.push(parseInt(x.value)); });
selectedDays = [];
document.querySelectorAll('.day-filter').forEach(x => { if (x.checked) selectedDays.push(parseInt(x.value)); });
saveFilter();
if (document.getElementById('tab1').classList.contains('active')) buildTab1();
});
});

document.getElementById('todayBtn').addEventListener('click', function() {
showTodayOnly = !showTodayOnly;
if (showTodayOnly) { this.classList.add('active'); this.textContent = 'Сегодня (вкл)'; }
else { this.classList.remove('active'); this.textContent = 'Сегодня'; }
saveFilter();
if (document.getElementById('tab1').classList.contains('active')) buildTab1();
});

document.getElementById('resetFiltersBtn').addEventListener('click', function() {
selectedMonths = [0,1,2,3,4];
selectedDays = [1,2,3,4,5];
showTodayOnly = false;
document.querySelectorAll('.month-filter').forEach(cb => cb.checked = appData.monthsVisibility[parseInt(cb.value)]);
document.querySelectorAll('.day-filter').forEach(cb => cb.checked = true);
document.getElementById('todayBtn').classList.remove('active');
document.getElementById('todayBtn').textContent = 'Сегодня';
saveFilter();
if (document.getElementById('tab1').classList.contains('active')) buildTab1();
});

document.getElementById('adminBtn').addEventListener('click', function() {
if (isAdmin) logoutAdmin();
else openAdminModal();
});

document.getElementById('modal').addEventListener('click', function(e) {
if (e.target === this) closeModal();
});

switchTab('tab2');
}

function openAdminModal() {
const modal = document.getElementById('modal');
const content = document.getElementById('modalContent');
content.innerHTML = `
<h3>Вход администратора</h3>
<input type="text" id="adminLogin" placeholder="Логин">
<input type="password" id="adminPwd" placeholder="Пароль">
<button class="btn-ok" onclick="checkAdminCredentials()">Войти</button>
<button class="btn-cancel" onclick="closeModal()">Отмена</button>
`;
modal.classList.add('visible');
document.getElementById('adminLogin').focus();
document.getElementById('adminLogin').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('adminPwd').focus(); });
document.getElementById('adminPwd').addEventListener('keydown', e => { if (e.key === 'Enter') checkAdminCredentials(); });
}

function checkAdminCredentials() {
const login = document.getElementById('adminLogin').value.trim();
const pwd = document.getElementById('adminPwd').value.trim();
if (login === 'admin' && pwd === '14082026') {
isAdmin = true;
saveFilter();
closeModal();
const adminBtn = document.getElementById('adminBtn');
adminBtn.classList.add('active');
adminBtn.textContent = 'Админ (вкл)';
document.getElementById('adminPanel').style.display = 'flex';
document.getElementById('statsTabBtn').style.display = 'inline-block';
document.getElementById('editorTabBtn').style.display = 'inline-block';
hasUnsavedChanges = false;
changeLog = [];
const activeTab = document.querySelector('.tab-content.active');
if (activeTab) {
const tabId = activeTab.id;
if (tabId === 'tab1') buildTab1();
else if (tabId === 'tab2') buildTab2();
else if (tabId === 'tab3') buildTab3();
else if (tabId === 'tab4') buildTab4();
}
} else alert('Неверный логин или пароль');
}

function closeModal() {
document.getElementById('modal').classList.remove('visible');
}

document.addEventListener('DOMContentLoaded', () => {
signInAnonymously();
const check = setInterval(() => {
if (appData) { clearInterval(check); init(); }
}, 300);
setTimeout(() => {
clearInterval(check);
if (!appData) { appData = createInitialData(); init(); }
}, 5000);
});
</script>

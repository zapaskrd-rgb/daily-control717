<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ежедневный Самоконтроль</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Все стили из предыдущей версии (компактно) */
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .filter-panel { background: #fff; padding: 10px 15px; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
        .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .filter-group label { font-weight: bold; margin-right: 5px; font-size: 14px; }
        .filter-group label input { margin-right: 3px; }
        .filter-today { background: #007bff; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .filter-today.active { background: #28a745; }
        .reset-filter-btn { background: #ffc107; color: #000; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .reset-filter-btn:hover { background: #e0a800; }
        .admin-panel { display: none; background: #f8f9fa; padding: 8px 15px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ccc; align-items: center; gap: 20px; flex-wrap: wrap; }
        .admin-panel.visible { display: flex; }
        .reset-btn { background: #dc3545; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
        .reset-btn:hover { background: #c82333; }
        .admin-panel .btn-success { background: #28a745; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
        .admin-panel .btn-success:hover { background: #218838; }
        .admin-panel .btn-primary { background: #007bff; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
        .admin-panel .btn-primary:hover { background: #0069d9; }
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.visible { display: flex; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; min-width: 350px; max-width: 600px; text-align: center; max-height: 80vh; overflow-y: auto; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .modal-content textarea { min-height: 80px; }
        .modal-content button { padding: 6px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .modal-content .btn-ok { background: #007bff; color: #fff; }
        .modal-content .btn-cancel { background: #6c757d; color: #fff; }
        .modal-content .btn-danger { background: #dc3545; color: #fff; }
        .modal-content .change-item { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
        .tab-btn { padding: 6px 12px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: #007bff; color: #fff; }
        .tab-content { display: none; background: #fff; padding: 8px; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow-x: auto; }
        .tab-content.active { display: block; }
        table { border-collapse: collapse; font-size: 11px; white-space: nowrap; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 2px 4px; text-align: center; vertical-align: middle; }
        th { background: #f0f0f0; position: sticky; top: 0; z-index: 10; }
        .month-header { background: #d9edf7; font-weight: bold; border-bottom: 3px solid #333 !important; }
        .month-end { border-right: 3px solid #333 !important; }
        .week-start { border-left: 2px solid #666 !important; }
        .day-end { border-bottom: 3px solid #333 !important; }
        .day-header, .task-name { text-align: left; padding-left: 8px; min-width: 200px; max-width: 400px; white-space: normal; word-break: break-word; }
        .day-header { font-weight: bold; }
        .day-1 { background-color: #e3f2fd; }
        .day-2 { background-color: #e8f5e9; }
        .day-3 { background-color: #fff3e0; }
        .day-4 { background-color: #fce4ec; }
        .day-5 { background-color: #f3e5f5; }
        .checkbox-cell { text-align: center; transition: background-color 0.2s; }
        .checkbox-cell.done-on-time { background-color: #a3d9a5 !important; }
        .checkbox-cell.done-late { background-color: #ffec8b !important; }
        .checkbox-cell.missed { background-color: #f9f9f9 !important; }
        input[type="checkbox"] { cursor: pointer; width: 14px; height: 14px; accent-color: darkgreen; margin: 0; }
        input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.7; }
        .cross-mark { color: red; font-size: 16px; font-weight: bold; }
        .empty-cell { background: #f9f9f9; }
        .task-desc { cursor: pointer; color: #007bff; text-decoration: underline; }
        .task-desc:hover { color: #0056b3; }
        .blocked-cell { background-color: #d3d3d3 !important; }
        .done-cell { background-color: #28a745 !important; color: #fff; cursor: pointer; }
        .done-cell:hover { opacity: 0.8; }
        .overdue-cell { background-color: #dc3545 !important; color: #fff; }
        .task-title-cell { min-width: 200px; max-width: 350px; white-space: normal; word-break: break-word; text-align: left; padding: 4px 6px; }
        .task-editor { display: flex; flex-direction: column; gap: 15px; }
        .task-editor .day-block { border: 1px solid #ccc; border-radius: 4px; padding: 10px; background: #fafafa; }
        .task-editor .day-block h4 { margin: 0 0 8px 0; background: #e9ecef; padding: 4px 8px; border-radius: 4px; }
        .task-editor .task-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .task-editor .task-item input[type="text"] { flex: 1; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
        .task-editor .task-item button { background: #dc3545; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
        .task-editor .add-task-form { display: flex; gap: 8px; margin-top: 6px; }
        .task-editor .add-task-form input[type="text"] { flex: 1; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
        .task-editor .add-task-form button { background: #28a745; color: #fff; border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
        .task-note-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #007bff; margin-left: 5px; }
        .task-note-btn:hover { color: #0056b3; }
        .task-info-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #17a2b8; margin-left: 3px; }
        .task-info-btn:hover { color: #0f7a8a; }
        .footer { margin-top: 20px; font-size: 12px; color: #666; display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
        .footer .admin-btn { background: #6c757d; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .footer .admin-btn.active { background: #28a745; }
        .no-data { padding: 20px; text-align: center; font-size: 16px; color: #888; }
        .stats-table td, .stats-table th { padding: 4px 8px; font-size: 12px; }
        .stats-filter { display: flex; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .stats-filter select, .stats-filter input { padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Ежедневный Самоконтроль</h1>

    <!-- Панель фильтров -->
    <div class="filter-panel" id="filterPanel">
        <div class="filter-group" id="monthFilterGroup">
            <label>Месяцы:</label>
            <label><input type="checkbox" class="month-filter" value="0" checked> Август</label>
            <label><input type="checkbox" class="month-filter" value="1" checked> Сентябрь</label>
            <label><input type="checkbox" class="month-filter" value="2" checked> Октябрь</label>
            <label><input type="checkbox" class="month-filter" value="3" checked> Ноябрь</label>
            <label><input type="checkbox" class="month-filter" value="4" checked> Декабрь</label>
        </div>
        <div class="filter-group" id="dayFilterGroup">
            <label>Дни недели:</label>
            <label><input type="checkbox" class="day-filter" value="1" checked> ПН</label>
            <label><input type="checkbox" class="day-filter" value="2" checked> ВТ</label>
            <label><input type="checkbox" class="day-filter" value="3" checked> СР</label>
            <label><input type="checkbox" class="day-filter" value="4" checked> ЧТ</label>
            <label><input type="checkbox" class="day-filter" value="5" checked> ПТ</label>
        </div>
        <div class="filter-group">
            <button id="todayBtn" class="filter-today">Сегодня</button>
            <button id="resetFiltersBtn" class="reset-filter-btn">Сброс фильтра</button>
        </div>
    </div>

    <!-- Админ-панель -->
    <div id="adminPanel" class="admin-panel" style="display:none;">
        <span>Режим администратора активен.</span>
        <button class="btn-success" onclick="addTask()">➕ Добавить задачу (Контроль задач)</button>
        <button class="btn-primary" onclick="saveChanges()">💾 Сохранить изменения</button>
        <button class="reset-btn" style="background:#6c757d;" onclick="logoutAdmin()">Выйти</button>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- Вкладки -->
    <div class="tabs" id="tabsContainer">
        <button class="tab-btn active" data-tab="tab1">Ежедневный Самоконтроль</button>
        <button class="tab-btn" data-tab="tab2">Контроль задач</button>
        <button class="tab-btn" data-tab="tab4" id="editorTabBtn" style="display:none;">Редактор задач</button>
        <button class="tab-btn" data-tab="tab3" id="statsTabBtn" style="display:none;">Статистика</button>
    </div>

    <!-- Контент -->
    <div id="contentContainer">
        <div id="tab1" class="tab-content active"></div>
        <div id="tab2" class="tab-content"></div>
        <div id="tab3" class="tab-content"></div>
        <div id="tab4" class="tab-content"></div>
    </div>

    <!-- Футер -->
    <div class="footer">
        <span>Данные синхронизируются в реальном времени.</span>
        <button id="adminBtn" class="admin-btn">Админ</button>
    </div>

    <script>
        // ====================================================================
        // 1. ПОДКЛЮЧЕНИЕ SUPABASE (ВАШИ ДАННЫЕ)
        // ====================================================================
        const SUPABASE_URL = 'https://pqfswgavkhotvtdcfbcm.supabase.co';  // без /rest/v1/
        const SUPABASE_ANON_KEY = 'sb_publishable_eB_viieych0bhJapY0tL_g_9y5zJ9DQ';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserId = null;
        let appData = null;
        let subscription = null;
        let isRealtimeConnected = false;

        // Дефолтные данные (взяты из вашего исходного кода)
        const DEFAULT_DAILY_TASKS = {
            1: [
                'История изменения ТОПов пополнения', 'УТО', 'Best Next',
                'Проработка резервов по Алмазу', 'Проработка maxов',
                'Анализ доступности на(%присутствия) проект', 'Анализ новинок',
                'Лидерский подход-присутствие ЛЦ,СТМ,Импорт,НК',
                'Аналитика отчета на предмет добора до франко,минимумы на тс, влияние През.рез. на мс тс',
                'Проработка каждой ссылки на твоем сайте'
            ],
            2: [
                'История изменения ТОПов пополнения', 'УТО', 'Best Next',
                'Отработка потенциального УТО', 'Проработка основных причин сплитования артикулов',
                'Проработка МС, ТС на предмет трансферов',
                'Проработка на предмет потенциального возврата поставщику',
                'Подготовка слайдов по направлению к презентации',
                'Проработка каждой ссылки на твоем сайте'
            ],
            3: [
                'История изменения ТОПов пополнения', 'УТО', 'Best Next',
                'Анализ артикулов, у которых ожидается изменение объема продаж относительно сезонности',
                'Обход отделов (коммуникации с МЭС)', 'Заполнение динамики показателей',
                'Проработать отчет по заказам с задержкой поставки',
                'Проработка каждой ссылки на твоем сайте'
            ],
            4: [
                'История изменения ТОПов пополнения', 'УТО', 'Best Next',
                'Отчет по возврату товара поставщику ( раб лист и утвержденные более 3х недель)',
                'Проработка топ0 на предмет возврата поставщику',
                'Проработка каждой ссылки на твоем сайте'
            ],
            5: [
                'История изменения ТОПов пополнения', 'УТО', 'Best Next',
                'Комментарии по низким рангам УТО', 'Анализ минимумов запаса',
                'Отработка потенциального УТО', 'Проработка МС, ТС на предмет трансферов',
                'Анализ скидок по поставщикам', 'Запас по артикулам ТОП25-100',
                'Проработка статистики коррекций Алмаза', 'Анализ товара без прогноза',
                'Проработка каждой ссылки на твоем сайте'
            ]
        };

        const DEFAULT_CONTROL_TASKS = {
            tasks: [
                { id: 't1', title: 'Согласовать бюджет', description: 'Согласовать бюджет с финансовым отделом до 15 числа', deadline: '2026-09-15', type: 'Контроль задач' },
                { id: 't2', title: 'Подготовить отчёт', description: 'Подготовить ежемесячный отчёт по продажам', deadline: '2026-09-20', type: 'Контроль задач' },
                { id: 't3', title: 'Провести встречу', description: 'Провести встречу с командой по проекту', deadline: '2026-09-25', type: 'Контроль задач' }
            ],
            taskStatus: {},
            logs: []
        };
        DEFAULT_CONTROL_TASKS.tasks.forEach(t => {
            for (let d = 1; d <= 15; d++) {
                const key = t.id + '_' + d;
                DEFAULT_CONTROL_TASKS.taskStatus[key] = { done: false, comment: '', blocked: false, doneDate: null, pendingComment: false };
            }
        });

        // ====================================================================
        // 2. ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE
        // ====================================================================
        async function loadAppData() {
            try {
                const { data, error } = await supabaseClient
                    .from('app_data')
                    .select('data')
                    .eq('id', 'main')
                    .single();

                if (error) {
                    if (error.code === 'PGRST116') { // запись не найдена
                        const initialData = {
                            dailyTasks: JSON.parse(JSON.stringify(DEFAULT_DAILY_TASKS)),
                            dailyNotes: {},
                            controlTasks: JSON.parse(JSON.stringify(DEFAULT_CONTROL_TASKS))
                        };
                        await supabaseClient
                            .from('app_data')
                            .insert([{ id: 'main', data: initialData }]);
                        appData = initialData;
                    } else {
                        console.error('Ошибка загрузки:', error);
                        return;
                    }
                } else {
                    appData = data.data;
                }

                // Подписываемся на изменения в реальном времени
                setupRealtimeSubscription();
                onDataLoaded();
            } catch (e) {
                console.error('Ошибка:', e);
            }
        }

        function setupRealtimeSubscription() {
            if (subscription) {
                subscription.unsubscribe();
                subscription = null;
            }

            subscription = supabaseClient
                .channel('app_data_changes')
                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'app_data',
                        filter: 'id=eq.main'
                    },
                    (payload) => {
                        appData = payload.new.data;
                        onDataLoaded();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        isRealtimeConnected = true;
                        console.log('Подписка на обновления установлена');
                    }
                });
        }

        function onDataLoaded() {
            if (!appData) return;
            // Проверяем структуру
            if (!appData.dailyTasks) appData.dailyTasks = JSON.parse(JSON.stringify(DEFAULT_DAILY_TASKS));
            if (!appData.dailyNotes) appData.dailyNotes = {};
            if (!appData.controlTasks) appData.controlTasks = JSON.parse(JSON.stringify(DEFAULT_CONTROL_TASKS));
            if (!appData.controlTasks.logs) appData.controlTasks.logs = [];
            if (!appData.controlTasks.taskStatus) appData.controlTasks.taskStatus = {};
            // Перерисовка активной вкладки
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab) {
                const tabId = activeTab.id;
                if (tabId === 'tab1') buildTab1();
                else if (tabId === 'tab2') buildTab2();
                else if (tabId === 'tab3') buildTab3();
                else if (tabId === 'tab4') buildTab4();
            } else {
                switchTab('tab1');
            }
            applyAllStyles();
        }

        // ====================================================================
        // 3. СОХРАНЕНИЕ ДАННЫХ
        // ====================================================================
        async function saveAppData() {
            if (!appData) return;
            try {
                const { error } = await supabaseClient
                    .from('app_data')
                    .update({ data: appData })
                    .eq('id', 'main');
                if (error) console.error('Ошибка сохранения:', error);
            } catch (e) {
                console.error('Ошибка сохранения:', e);
            }
        }

        // Обёртки
        function getDailyTasks() {
            return appData ? appData.dailyTasks : JSON.parse(JSON.stringify(DEFAULT_DAILY_TASKS));
        }
        function saveDailyTasks(tasks) {
            if (!appData) return;
            appData.dailyTasks = tasks;
            saveAppData();
        }
        function getDailyTaskNotes() {
            return appData ? appData.dailyNotes : {};
        }
        function saveDailyTaskNotes(notes) {
            if (!appData) return;
            appData.dailyNotes = notes;
            saveAppData();
        }
        function getControlTasksData() {
            if (!appData) return { tasks: [], taskStatus: {}, logs: [] };
            return appData.controlTasks;
        }
        function saveControlTasksData(data) {
            if (!appData) return;
            appData.controlTasks = data;
            saveAppData();
        }

        function addLog(taskId, depId, action, taskType, comment) {
            if (!appData) return;
            const now = new Date();
            const timestamp = now.toISOString();
            const date = now.toLocaleDateString('ru-RU');
            const time = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const logEntry = {
                taskId: taskId,
                depId: depId,
                action: action,
                timestamp: timestamp,
                date: date + ' ' + time,
                userType: isAdmin ? 'admin' : 'user',
                taskType: taskType || 'Контроль задач',
                comment: comment || '',
                userId: currentUserId || 'anonymous'
            };
            if (!appData.controlTasks.logs) appData.controlTasks.logs = [];
            appData.controlTasks.logs.push(logEntry);
            saveAppData();
        }

        // ====================================================================
        // 4. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ====================================================================
        const YEAR = 2026;
        const MONTHS = ['Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const MONTH_INDEXES = [7, 8, 9, 10, 11];
        const DEPARTMENTS = 15;

        let selectedMonths = [0,1,2,3,4];
        let selectedDays = [1,2,3,4,5];
        let showTodayOnly = false;
        let isAdmin = false;
        let hasUnsavedChanges = false;
        let changeLog = [];

        function addChange(description) {
            if (isAdmin) {
                changeLog.push(description);
                hasUnsavedChanges = true;
            }
        }

        function loadState() {
            const savedMonths = localStorage.getItem('filter_months');
            if (savedMonths) {
                try { selectedMonths = JSON.parse(savedMonths); } catch(e) {}
            }
            const savedDays = localStorage.getItem('filter_days');
            if (savedDays) {
                try { selectedDays = JSON.parse(savedDays); } catch(e) {}
            }
            const savedToday = localStorage.getItem('filter_today');
            if (savedToday === 'true') showTodayOnly = true;
            const savedAdmin = localStorage.getItem('isAdmin');
            if (savedAdmin === 'true') isAdmin = true;

            document.querySelectorAll('.month-filter').forEach(cb => {
                cb.checked = selectedMonths.includes(parseInt(cb.value));
            });
            document.querySelectorAll('.day-filter').forEach(cb => {
                cb.checked = selectedDays.includes(parseInt(cb.value));
            });
            const todayBtn = document.getElementById('todayBtn');
            if (showTodayOnly) {
                todayBtn.classList.add('active');
                todayBtn.textContent = 'Сегодня (вкл)';
            } else {
                todayBtn.classList.remove('active');
                todayBtn.textContent = 'Сегодня';
            }
            const adminBtn = document.getElementById('adminBtn');
            if (isAdmin) {
                adminBtn.classList.add('active');
                adminBtn.textContent = 'Админ (вкл)';
                document.getElementById('adminPanel').style.display = 'flex';
                document.getElementById('statsTabBtn').style.display = 'inline-block';
                document.getElementById('editorTabBtn').style.display = 'inline-block';
            } else {
                adminBtn.classList.remove('active');
                adminBtn.textContent = 'Админ';
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('statsTabBtn').style.display = 'none';
                document.getElementById('editorTabBtn').style.display = 'none';
            }
            if (!isAdmin) {
                hasUnsavedChanges = false;
                changeLog = [];
            }
        }

        function saveFilter() {
            localStorage.setItem('filter_months', JSON.stringify(selectedMonths));
            localStorage.setItem('filter_days', JSON.stringify(selectedDays));
            localStorage.setItem('filter_today', showTodayOnly ? 'true' : 'false');
            localStorage.setItem('isAdmin', isAdmin ? 'true' : 'false');
        }

        function getDatesForDay(monthIndex, dayOfWeek) {
            const dates = [];
            const date = new Date(YEAR, monthIndex, 1);
            const firstDay = date.getDay();
            let diff = dayOfWeek - firstDay;
            if (diff < 0) diff += 7;
            date.setDate(date.getDate() + diff);
            while (date.getMonth() === monthIndex) {
                dates.push(date.getDate());
                date.setDate(date.getDate() + 7);
            }
            return dates;
        }

        function getWeeksForMonth(monthIndex) {
            const weeks = [];
            let firstDate = new Date(YEAR, monthIndex, 1);
            let dayOfWeek = firstDate.getDay();
            let diffToMon = (dayOfWeek === 0) ? 1 : (8 - dayOfWeek) % 7;
            if (dayOfWeek === 1) diffToMon = 0;
            firstDate.setDate(firstDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            let current = new Date(firstDate);
            while (current.getMonth() <= monthIndex && current.getFullYear() === YEAR) {
                const week = [];
                let hasDayInMonth = false;
                for (let d = 0; d < 5; d++) {
                    const dateObj = new Date(current);
                    dateObj.setDate(dateObj.getDate() + d);
                    week.push({
                        dayOfWeek: d + 1,
                        monthIndex: dateObj.getMonth(),
                        date: dateObj.getDate()
                    });
                    if (dateObj.getMonth() === monthIndex) hasDayInMonth = true;
                }
                if (hasDayInMonth) weeks.push(week);
                current.setDate(current.getDate() + 7);
                if (current.getMonth() > monthIndex) break;
            }
            return weeks;
        }

        function isDayPassedByDate(dateObj) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const planned = new Date(YEAR, dateObj.monthIndex, dateObj.date);
            return today > planned;
        }

            const d = new Date(YEAR, monthIndex, day);

            const savedDate = localStorage.getItem(id + '_date');
            const parts = id.split('_');
            const plannedDate = parts[parts.length - 1];

                    if (status.blocked) {

                            const data2 = getControlTasksData();
                            const key2 = task.id + '_' + dep;
                            if (!data2.taskStatus[key2]) data2.taskStatus[key2] = { done: false, comment: '', blocked: false, doneDate: null, pendingComment: false };
                            data2.taskStatus[key2].blocked = !data2.taskStatus[key2].blocked;
                            if (data2.taskStatus[key2].blocked) {
                                data2.taskStatus[key2].done = false;
                                data2.taskStatus[key2].comment = '';
                                data2.taskStatus[key2].doneDate = null;
                            }
                            addLog(task.id, dep, 'block', 'Контроль задач', '');
                            saveControlTasksData(data2);
                            addChange(`Блокировка для задачи "${task.title}" (отдел ${dep}) изменена.`);
                            buildTab2();
                        });
                        td.appendChild(blockBtn);
                    }

                    row.appendChild(td);
                });
                tbody.appendChild(row);
            }

            table.appendChild(thead);
            table.appendChild(tbody);
            container.appendChild(table);
        }

        // ====================================================================
        // 7. ТРЕТЬЯ ВКЛАДКА – СТАТИСТИКА
        // ====================================================================
        function buildTab3() {
            const container = document.getElementById('tab3');
            container.innerHTML = '';

            if (!isAdmin) {
                container.innerHTML = '<div class="no-data">Доступно только в режиме администратора.</div>';
                return;
            }

            const data = getControlTasksData();
            const tasks = data.tasks;
            const allLogs = data.logs || [];

            const filterDiv = document.createElement('div');
            filterDiv.className = 'stats-filter';
            filterDiv.innerHTML = `
                <label>Тип задач: 
                    <select id="statsTypeFilter">
                        <option value="all">Все</option>
                        <option value="Ежедневный Самоконтроль">Ежедневные задачи</option>
                        <option value="Контроль задач">Разовые</option>
                    </select>
                </label>
                <label>Отдел: 
                    <select id="statsDeptFilter">
                        <option value="all">Все</option>
                        ${Array.from({length: DEPARTMENTS}, (_,i) => `<option value="${i+1}">Отдел ${i+1}</option>`).join('')}
                    </select>
                </label>
                <label>Дата: 
                    <select id="statsDateFilter">
                        <option value="all">Все</option>
                        <option value="today">Сегодня</option>
                        <option value="week">Неделя</option>
                    </select>
                </label>
                <button onclick="applyStatsFilters()">Применить</button>
            `;
            container.appendChild(filterDiv);

            const statsContainer = document.createElement('div');
            statsContainer.id = 'statsContainer';
            container.appendChild(statsContainer);

            function renderStats() {
                const typeFilter = document.getElementById('statsTypeFilter').value;
                const deptFilter = parseInt(document.getElementById('statsDeptFilter').value);
                const dateFilter = document.getElementById('statsDateFilter').value;

                let filteredLogs = allLogs.filter(log => log.userType === 'user');
                if (typeFilter !== 'all') {
                    filteredLogs = filteredLogs.filter(log => log.taskType === typeFilter);
                }
                if (deptFilter !== 'all') {
                    filteredLogs = filteredLogs.filter(log => log.depId === deptFilter);
                }
                const now = new Date();
                const todayStr = now.toISOString().slice(0, 10);
                if (dateFilter === 'today') {
                    filteredLogs = filteredLogs.filter(log => log.timestamp && log.timestamp.slice(0, 10) === todayStr);
                } else if (dateFilter === 'week') {
                    const weekAgo = new Date(now);
                    weekAgo.setDate(weekAgo.getDate() - 7);
                    const weekAgoStr = weekAgo.toISOString();
                    filteredLogs = filteredLogs.filter(log => log.timestamp >= weekAgoStr);
                }

                const statusMap = {};
                filteredLogs.forEach(log => {
                    const key = log.taskId + '_' + log.depId;
                    if (!statusMap[key] || new Date(log.timestamp) > new Date(statusMap[key].timestamp)) {
                        statusMap[key] = log;
                    }
                });

                const taskIds = new Set();
                filteredLogs.forEach(log => taskIds.add(log.taskId));
                const allTasks = tasks.filter(t => taskIds.has(t.id));
                const dailyTaskIds = [...taskIds].filter(id => id.startsWith('daily_') || id.startsWith('note_'));
                const dailyTasks = dailyTaskIds.map(id => ({
                    id: id,
                    title: id.startsWith('daily_') ? 'Ежедневная задача' : 'Заметка',
                    type: 'Ежедневный Самоконтроль',
                    deadline: '—'
                }));

                const allTasksForDisplay = [...allTasks, ...dailyTasks];
                const statsContainer = document.getElementById('statsContainer');
                statsContainer.innerHTML = '';

                const statusTable = document.createElement('table');
                statusTable.className = 'stats-table';
                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr>
                        <th>Задача</th>
                        <th>Тип</th>
                        <th>Дедлайн</th>
                        <th>Отдел</th>
                        <th>Статус</th>
                        <th>Комментарий</th>
                        <th>Дата выполнения</th>
                    </tr>
                `;
                statusTable.appendChild(thead);
                const tbody = document.createElement('tbody');

                allTasksForDisplay.forEach(task => {
                    for (let d = 1; d <= DEPARTMENTS; d++) {
                        const key = task.id + '_' + d;
                        const log = statusMap[key];
                        if (!log) continue;
                        const status = log.action === 'done' ? '✅ Выполнено' : (log.action === 'block' ? '⛔ Заблокировано' : '⏳ Не выполнено');
                        const comment = log.comment || '';
                        const doneDate = log.action === 'done' ? (log.date || log.timestamp) : '—';
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${task.title}</td>
                            <td>${task.type || 'Контроль задач'}</td>
                            <td>${task.deadline || '—'}</td>
                            <td>Отдел ${d}</td>
                            <td>${status}</td>
                            <td style="white-space:pre-wrap;max-width:150px;">${comment}</td>
                            <td>${doneDate}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });
                statusTable.appendChild(tbody);
                statsContainer.appendChild(statusTable);

                const percentDiv = document.createElement('div');
                percentDiv.innerHTML = '<h3>Статистика выполнения по отделам</h3>';
                const percentTable = document.createElement('table');
                percentTable.className = 'stats-table';
                const pThead = document.createElement('thead');
                pThead.innerHTML = `<tr><th>Отдел</th><th>Выполнено</th><th>Всего (активных)</th><th>%</th><th>Просрочено</th></tr>`;
                percentTable.appendChild(pThead);
                const pTbody = document.createElement('tbody');
                const deptStats = {};
                for (let d = 1; d <= DEPARTMENTS; d++) {
                    deptStats[d] = { total: 0, done: 0, overdue: 0 };
                }
                const controlData = getControlTasksData();
                const taskStatus = controlData.taskStatus;
                const allControlTasks = controlData.tasks;
                const dailyLogs = allLogs.filter(log => log.taskType === 'Ежедневный Самоконтроль' && log.userType === 'user');
                const dailyStatusMap = {};
                dailyLogs.forEach(log => {
                    const key = log.taskId + '_' + log.depId;
                    if (!dailyStatusMap[key] || new Date(log.timestamp) > new Date(dailyStatusMap[key].timestamp)) {
                        dailyStatusMap[key] = log;
                    }
                });

                for (let d = 1; d <= DEPARTMENTS; d++) {
                    allControlTasks.forEach(task => {
                        const key = task.id + '_' + d;
                        const status = taskStatus[key];
                        if (status && !status.blocked) {
                            deptStats[d].total++;
                            if (status.done) deptStats[d].done++;
                            if (!status.done && task.deadline && task.deadline !== '—') {
                                const now = new Date();
                                const deadline = new Date(task.deadline + 'T00:00:00');
                                if (now > deadline) deptStats[d].overdue++;
                            }
                        }
                    });
                    const dailyKeys = Object.keys(dailyStatusMap).filter(k => k.endsWith('_' + d));
                    dailyKeys.forEach(key => {
                        const log = dailyStatusMap[key];
                        if (log.action === 'done') {
                            deptStats[d].total++;
                            deptStats[d].done++;
                        } else if (log.action === 'uncheck' || log.action === 'block') {
                            deptStats[d].total++;
                        }
                    });
                }

                for (let d = 1; d <= DEPARTMENTS; d++) {
                    const stat = deptStats[d];
                    const pct = stat.total > 0 ? Math.round((stat.done / stat.total) * 100) : 0;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>Отдел ${d}</td>
                        <td>${stat.done}</td>
                        <td>${stat.total}</td>
                        <td>${pct}%</td>
                        <td>${stat.overdue}</td>
                    `;
                    pTbody.appendChild(tr);
                }
                percentTable.appendChild(pTbody);
                percentDiv.appendChild(percentTable);
                statsContainer.appendChild(percentDiv);

                const logsDiv = document.createElement('div');
                logsDiv.innerHTML = '<h3>Логи действий (отфильтрованные)</h3>';
                const logTable = document.createElement('table');
                logTable.className = 'stats-table';
                const logThead = document.createElement('thead');
                logThead.innerHTML = `
                    <tr>
                        <th>Наименование задачи</th>
                        <th>Тип</th>
                        <th>Дедлайн</th>
                        <th>Время клика</th>
                        <th>Действие</th>
                        <th>Комментарий</th>
                    </tr>
                `;
                logTable.appendChild(logThead);
                const logTbody = document.createElement('tbody');
                const sortedLogs = filteredLogs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                sortedLogs.forEach(log => {
                    let taskTitle = log.taskId;
                    let taskType = log.taskType || 'Контроль задач';
                    let deadline = '—';
                    if (log.taskId.startsWith('daily_') || log.taskId.startsWith('note_')) {
                        taskTitle = log.taskId;
                        taskType = 'Ежедневный Самоконтроль';
                    } else {
                        const task = tasks.find(t => t.id === log.taskId);
                        if (task) {
                            taskTitle = task.title;
                            deadline = task.deadline || '—';
                        }
                    }
                    const tr = document.createElement('tr');
                    const actionLabel = log.action === 'done' ? 'Выполнено' : 
                                        (log.action === 'uncheck' ? 'Снято' : 
                                        (log.action === 'block' ? 'Блокировка' : 
                                        (log.action === 'edit_note' ? 'Редактирование заметки' : 
                                        (log.action === 'delete_note' ? 'Удаление заметки' : 
                                        (log.action === 'edit_comment' ? 'Редактирование комментария' : log.action)))));
                    tr.innerHTML = `
                        <td>${taskTitle}</td>
                        <td>${taskType}</td>
                        <td>${deadline}</td>
                        <td>${log.date || log.timestamp}</td>
                        <td>${actionLabel}</td>
                        <td style="white-space:pre-wrap;max-width:150px;">${log.comment || ''}</td>
                    `;
                    logTbody.appendChild(tr);
                });
                logTable.appendChild(logTbody);
                logsDiv.appendChild(logTable);
                statsContainer.appendChild(logsDiv);
            }

            window.applyStatsFilters = renderStats;
            renderStats();

            const refreshBtn = document.createElement('button');
            refreshBtn.textContent = 'Обновить статистику';
            refreshBtn.onclick = function() { buildTab3(); };
            container.appendChild(refreshBtn);
        }

        // ====================================================================
        // 8. ЧЕТВЁРТАЯ ВКЛАДКА – РЕДАКТОР ЗАДАЧ
        // ====================================================================
        function buildTab4() {
            const container = document.getElementById('tab4');
            container.innerHTML = '';

            if (!isAdmin) {
                container.innerHTML = '<div class="no-data">Доступно только в режиме администратора.</div>';
                return;
            }

            const tasksByDay = getDailyTasks();
            const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница'];

            const editorDiv = document.createElement('div');
            editorDiv.className = 'task-editor';

            for (let dow = 1; dow <= 5; dow++) {
                const block = document.createElement('div');
                block.className = 'day-block';
                const title = document.createElement('h4');
                title.textContent = dayNames[dow-1];
                block.appendChild(title);

                const list = document.createElement('div');
                list.className = 'task-list';
                const tasks = tasksByDay[dow] || [];

                tasks.forEach((task, idx) => {
                    const item = document.createElement('div');
                    item.className = 'task-item';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = task;
                    input.addEventListener('change', function() {
                        const newVal = this.value.trim();
                        if (newVal === '') {
                            alert('Задача не может быть пустой');
                            this.value = task;
                            return;
                        }
                        const data = getDailyTasks();
                        data[dow][idx] = newVal;
                        saveDailyTasks(data);
                        addChange(`Задача "${task}" заменена на "${newVal}" (${dayNames[dow-1]})`);
                        alert('Задача обновлена.');
                        buildTab1();
                        buildTab4();
                    });
                    item.appendChild(input);
                    const delBtn = document.createElement('button');
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', function() {
                        if (confirm('Удалить задачу?')) {
                            const data = getDailyTasks();
                            data[dow].splice(idx, 1);
                            saveDailyTasks(data);
                            addChange(`Задача "${task}" удалена (${dayNames[dow-1]})`);
                            alert('Задача удалена.');
                            buildTab1();
                            buildTab4();
                        }
                    });
                    item.appendChild(delBtn);
                    list.appendChild(item);
                });

                block.appendChild(list);

                const addForm = document.createElement('div');
                addForm.className = 'add-task-form';
                const newInput = document.createElement('input');
                newInput.type = 'text';
                newInput.placeholder = 'Новая задача...';
                const addBtn = document.createElement('button');
                addBtn.textContent = 'Добавить';
                addBtn.addEventListener('click', function() {
                    const val = newInput.value.trim();
                    if (val === '') { alert('Введите задачу'); return; }
                    const data = getDailyTasks();
                    if (!data[dow]) data[dow] = [];
                    data[dow].push(val);
                    saveDailyTasks(data);
                    addChange(`Добавлена задача "${val}" (${dayNames[dow-1]})`);
                    alert('Задача добавлена.');
                    buildTab1();
                    buildTab4();
                });
                newInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') addBtn.click();
                });
                addForm.appendChild(newInput);
                addForm.appendChild(addBtn);
                block.appendChild(addForm);

                editorDiv.appendChild(block);
            }

            container.appendChild(editorDiv);
        }

                <p><strong>Описание:</strong> ${task.description || 'Нет описания'}</p>
                <p><strong>Дедлайн:</strong> ${task.deadline || 'Не задан'}</p>
                <button class="btn-cancel" onclick="closeModal()">Закрыть</button>
            `;

        function editTask(taskId) {
            const data = getControlTasksData();
            const task = data.tasks.find(t => t.id === taskId);
            if (!task) return;
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Редактирование задачи</h3>
                <input type="text" id="editTitle" value="${task.title}" placeholder="Название">

                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            `;
            modal.classList.add('visible');
        }

        function saveEditTask(taskId) {
            const title = document.getElementById('editTitle').value.trim();
            const description = document.getElementById('editDesc').value.trim();
            const deadline = document.getElementById('editDeadline').value;
            if (!title) { alert('Название обязательно'); return; }
            const data = getControlTasksData();
            const task = data.tasks.find(t => t.id === taskId);
            if (task) {
                const oldTitle = task.title;
                task.title = title;
                task.description = description;
                task.deadline = deadline;
                saveControlTasksData(data);
                addChange(`Задача "${oldTitle}" обновлена (новое название: "${title}")`);
                alert('Задача обновлена.');
            }
            closeModal();
            buildTab2();
        }

        function deleteTask(taskId) {
            if (!confirm('Удалить задачу?')) return;
            const data = getControlTasksData();
            const task = data.tasks.find(t => t.id === taskId);
            if (task) {
                addChange(`Задача "${task.title}" удалена из Контроля задач`);
            }
            data.tasks = data.tasks.filter(t => t.id !== taskId);
            Object.keys(data.taskStatus).forEach(key => {
                if (key.startsWith(taskId + '_')) delete data.taskStatus[key];
            });
            saveControlTasksData(data);
            alert('Задача удалена.');
            buildTab2();
        }

        function addTask() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Добавить новую задачу (Контроль задач)</h3>
                <input type="text" id="newTitle" placeholder="Название задачи">
                <textarea id="newDesc" placeholder="Описание"></textarea>
                <input type="date" id="newDeadline">
                <button class="btn-ok" onclick="saveNewTask()">Добавить</button>
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            `;
            modal.classList.add('visible');
        }

        function saveNewTask() {
            const title = document.getElementById('newTitle').value.trim();
            const description = document.getElementById('newDesc').value.trim();
            const deadline = document.getElementById('newDeadline').value;
            if (!title) { alert('Название обязательно'); return; }
            const data = getControlTasksData();
            const newId = 't' + Date.now();
            data.tasks.push({
                id: newId,
                title: title,
                description: description,
                deadline: deadline,
                type: 'Контроль задач'
            });
            for (let d = 1; d <= DEPARTMENTS; d++) {
                const key = newId + '_' + d;
                data.taskStatus[key] = { done: false, comment: '', blocked: false, doneDate: null, pendingComment: false };
            }
            saveControlTasksData(data);
            addChange(`Добавлена задача "${title}" в Контроль задач`);
            alert('Задача добавлена.');
            closeModal();
            buildTab2();
        }

        // ====================================================================
        // 10. СОХРАНЕНИЕ ИЗМЕНЕНИЙ И ВЫХОД
        // ====================================================================
        function saveChanges() {
            if (!hasUnsavedChanges) {
                alert('Нет несохранённых изменений.');
                return;
            }
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            let changesHtml = changeLog.map(item => `<div class="change-item">• ${item}</div>`).join('');
            content.innerHTML = `
                <h3>Подтверждение сохранения</h3>
                <p>Будут сохранены следующие изменения:</p>
                <div style="max-height:250px;overflow-y:auto;text-align:left;margin:10px 0;border:1px solid #eee;border-radius:4px;">${changesHtml}</div>
                <button class="btn-ok" onclick="confirmSave()">Подтвердить</button>
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            `;
            modal.classList.add('visible');
        }

        function confirmSave() {
            hasUnsavedChanges = false;
            changeLog = [];
            closeModal();
            alert('Изменения сохранены.');
        }

        function logoutAdmin() {
            if (hasUnsavedChanges) {
                if (confirm('Есть несохранённые изменения. При выходе они будут потеряны. Всё равно выйти?')) {
                    hasUnsavedChanges = false;
                    changeLog = [];
                    doLogout();
                }
            } else {
                doLogout();
            }
        }

        function doLogout() {
            isAdmin = false;
            saveFilter();
            const adminBtn = document.getElementById('adminBtn');
            adminBtn.classList.remove('active');
            adminBtn.textContent = 'Админ';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('statsTabBtn').style.display = 'none';
            document.getElementById('editorTabBtn').style.display = 'none';
            hasUnsavedChanges = false;
            changeLog = [];
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab) {
                const tabId = activeTab.id;
                if (tabId === 'tab1') buildTab1();
                else if (tabId === 'tab2') buildTab2();
                else if (tabId === 'tab3') buildTab3();
                else if (tabId === 'tab4') buildTab4();
            }
        }

        // ====================================================================
        // 11. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ====================================================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
            if (btn) btn.classList.add('active');

            const filterPanel = document.getElementById('filterPanel');
            if (tabId === 'tab1') {
                filterPanel.style.display = 'flex';
            } else {
                filterPanel.style.display = 'none';
            }

            if (tabId === 'tab1') buildTab1();
            else if (tabId === 'tab2') buildTab2();
            else if (tabId === 'tab3') buildTab3();
            else if (tabId === 'tab4') buildTab4();
        }

        // ====================================================================
        // 12. АУТЕНТИФИКАЦИЯ И ИНИЦИАЛИЗАЦИЯ
        // ====================================================================
        async function signInAnonymously() {
            try {
                const { data, error } = await supabaseClient.auth.signInAnonymously();
                if (error) throw error;
                currentUserId = data.user.id;
                console.log('Анонимный вход выполнен, uid:', currentUserId);
                loadAppData();
            } catch (error) {
                console.error('Ошибка анонимного входа:', error);
                // Всё равно пытаемся загрузить данные (если политики RLS разрешают)
                loadAppData();
            }
        }

        function init() {
            loadState();

            document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabId = this.dataset.tab;
                    switchTab(tabId);
                });
            });

            document.querySelectorAll('.month-filter, .day-filter').forEach(cb => {
                cb.addEventListener('change', function() {
                    if (showTodayOnly) {
                        showTodayOnly = false;
                        document.getElementById('todayBtn').classList.remove('active');
                        document.getElementById('todayBtn').textContent = 'Сегодня';
                    }
                    updateFilterFromUI();
                    if (document.getElementById('tab1').classList.contains('active')) {
                        buildTab1();
                    }
                });
            });

            document.getElementById('todayBtn').addEventListener('click', function() {
                showTodayOnly = !showTodayOnly;
                if (showTodayOnly) {
                    this.classList.add('active');
                    this.textContent = 'Сегодня (вкл)';
                } else {
                    this.classList.remove('active');
                    this.textContent = 'Сегодня';
                }
                saveFilter();
                if (document.getElementById('tab1').classList.contains('active')) {
                    buildTab1();
                }
            });

            document.getElementById('resetFiltersBtn').addEventListener('click', function() {
                selectedMonths = [0,1,2,3,4];
                selectedDays = [1,2,3,4,5];
                showTodayOnly = false;
                document.querySelectorAll('.month-filter').forEach(cb => cb.checked = true);
                document.querySelectorAll('.day-filter').forEach(cb => cb.checked = true);
                document.getElementById('todayBtn').classList.remove('active');
                document.getElementById('todayBtn').textContent = 'Сегодня';
                saveFilter();
                if (document.getElementById('tab1').classList.contains('active')) {
                    buildTab1();
                }
            });

            document.getElementById('adminBtn').addEventListener('click', function() {
                if (isAdmin) {
                    logoutAdmin();
                } else {
                    openAdminModal();
                }
            });

            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            if (appData) {
                switchTab('tab1');
            }
        }

        function updateFilterFromUI() {
            const monthCbs = document.querySelectorAll('.month-filter');
            selectedMonths = [];
            monthCbs.forEach(cb => {
                if (cb.checked) selectedMonths.push(parseInt(cb.value));
            });
            const dayCbs = document.querySelectorAll('.day-filter');
            selectedDays = [];
            dayCbs.forEach(cb => {
                if (cb.checked) selectedDays.push(parseInt(cb.value));
            });
            saveFilter();
        }

        function openAdminModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Вход в режим администратора</h3>
                <p>Введите логин и пароль:</p>
                <input type="text" id="adminLogin" placeholder="Логин">
                <input type="password" id="adminPwd" placeholder="Пароль">
                <br>
                <button class="btn-ok" onclick="checkAdminCredentials()">Войти</button>
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            `;
            modal.classList.add('visible');
            document.getElementById('adminLogin').focus();
            document.getElementById('adminLogin').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('adminPwd').focus();
            });
            document.getElementById('adminPwd').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkAdminCredentials();
            });
        }

        function checkAdminCredentials() {
            const login = document.getElementById('adminLogin').value.trim();
            const pwd = document.getElementById('adminPwd').value.trim();
            if (login === 'admin' && pwd === '14082026') {
                isAdmin = true;
                saveFilter();
                closeModal();
                const adminBtn = document.getElementById('adminBtn');
                adminBtn.classList.add('active');
                adminBtn.textContent = 'Админ (вкл)';
                document.getElementById('adminPanel').style.display = 'flex';
                document.getElementById('statsTabBtn').style.display = 'inline-block';
                document.getElementById('editorTabBtn').style.display = 'inline-block';
                hasUnsavedChanges = false;
                changeLog = [];
                const activeTab = document.querySelector('.tab-content.active');
                if (activeTab) {
                    const tabId = activeTab.id;
                    if (tabId === 'tab1') buildTab1();
                    else if (tabId === 'tab2') buildTab2();
                    else if (tabId === 'tab3') buildTab3();
                    else if (tabId === 'tab4') buildTab4();
                }
            } else {
                alert('Неверный логин или пароль');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('visible');
        }

        // ====================================================================
        // ЗАПУСК
        // ====================================================================
        document.addEventListener('DOMContentLoaded', function() {
            signInAnonymously();
            const checkData = setInterval(() => {
                if (appData) {
                    clearInterval(checkData);
                    init();
                }
            }, 500);
            setTimeout(() => {
                clearInterval(checkData);
                if (!appData) {
                    appData = {
                        dailyTasks: JSON.parse(JSON.stringify(DEFAULT_DAILY_TASKS)),
                        dailyNotes: {},
                        controlTasks: JSON.parse(JSON.stringify(DEFAULT_CONTROL_TASKS))
                    };
                    init();
                }
            }, 5000);
        });
    </script>
</body>
</html>
